<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mural | LPV</title>
    
    <script>
        (function() {
            document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <link rel="stylesheet" href="../assets/css/pages/mural.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="../assets/images/lpvminilogo2.png">
</head>
<body>

    <aside class="desktop-sidebar">
        <div class="sidebar-header">
            <img src="../assets/images/lpvminilogo2.png" alt="LPV" class="light-mode-only" style="height: 40px;">
            <img src="../assets/images/lpvminilogo.png" alt="LPV" class="dark-mode-only" style="height: 40px;">
            <div style="line-height: 1;">
                <div class="sidebar-brand-text">LPV Digital</div>
                <div style="font-size: 0.75rem; color: var(--text-secondary);">Patologia Veterinária</div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="hub.html" class="sidebar-link"><i class="fas fa-home"></i> <span>Visão Geral</span></a>
            <a href="mural.html" class="sidebar-link active"><i class="fas fa-columns"></i> <span>Mural</span></a>
            <a href="historico.html" class="sidebar-link"><i class="fas fa-history"></i> <span>Registros</span></a>
            <a href="estoque.html" class="sidebar-link"><i class="fas fa-boxes-stacked"></i> <span>Estoque</span></a>
            <a href="planner.html" class="sidebar-link"><i class="fas fa-calendar-alt"></i> <span>Planner</span></a>
             <a href="admin.html" class="sidebar-link hidden" id="sidebar-admin-link"><i class="fas fa-shield-alt"></i> <span>Admin</span></a>
            <button class="sidebar-link btn-sidebar-new"><i class="fas fa-plus"></i> <span>Nova Entrada</span></button>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user-avatar"><i class="fas fa-user"></i></div>
            <div class="sidebar-user-info">
                <div id="sidebar-user-name" class="user-name-text">...</div>
                <div id="sidebar-user-role" class="user-role-text">...</div>
            </div>
            <button id="logout-btn-desk" class="btn-sidebar-settings"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </aside>

    <div class="layout-wrapper">
        <header class="app-header">
            <div class="header-brand" style="display: flex; align-items: center; gap: 10px;">
                <button id="mobile-menu-btn" class="btn-icon mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </button>
                <img src="../assets/images/lpvminilogo2.png" alt="Logo" class="header-logo light-mode-only">
                <img src="../assets/images/lpvminilogo.png" alt="Logo" class="header-logo dark-mode-only">
                
                <div class="header-text-column">
                    <span class="brand-title">LPV<span class="brand-subtitle">Mural</span></span>
                    <span id="user-role-badge" class="user-badge">...</span>
                </div>
                <span class="page-title">Mural de Amostras</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="logout-btn" class="btn-icon" style="color: var(--color-error);"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <main class="main-container mural-main">
            
            <div class="mural-toolbar">
                <div class="mural-toolbar-info">
                    <span class="mural-toolbar-title">Laudos pendentes</span>
                    <span class="mural-toolbar-sub">Casos liberados saem daqui e vão para o Livro de Registros.</span>
                </div>
                <div class="mural-switch" role="group" aria-label="Filtro de amostras">
                    <button type="button" id="filter-all" class="mural-switch-btn is-active" aria-pressed="true">Todos</button>
                    <button type="button" id="filter-mine" class="mural-switch-btn" aria-pressed="false">Minhas</button>
                </div>
            </div>

            <div class="carousel-indicators" id="carousel-dots"></div>

            <div class="mural-board" id="mural-board">
                <section class="mural-panel type-necro active-panel" id="panel-necropsias" aria-labelledby="title-necropsias">
                    <header class="mural-panel-header">
                        <h2 class="mural-panel-title" id="title-necropsias">
                            <i class="fas fa-paw"></i> Necropsias
                        </h2>
                        <span class="mural-panel-count" id="count-necropsias">0</span>
                    </header>
                    <div class="mural-panel-body" id="list-necropsias"></div>
                </section>

                <section class="mural-panel type-bio" id="panel-biopsias" aria-labelledby="title-biopsias">
                    <header class="mural-panel-header">
                        <h2 class="mural-panel-title" id="title-biopsias">
                            <i class="fas fa-microscope"></i> Biópsias
                        </h2>
                        <span class="mural-panel-count" id="count-biopsias">0</span>
                    </header>
                    <div class="mural-panel-body" id="list-biopsias"></div>
                </section>
            </div>
        </main>
    </div>

    <nav class="bottom-nav">
        <a href="hub.html" class="nav-item"><i class="fas fa-home"></i><span>Início</span></a>
        <a href="mural.html" class="nav-item active"><i class="fas fa-columns"></i><span>Mural</span></a>
        <div class="nav-fab-container"><button class="nav-fab"><i class="fas fa-plus"></i></button></div>
        <a href="historico.html" class="nav-item"><i class="fas fa-history"></i><span>Registros</span></a>
        <a href="planner.html" class="nav-item"><i class="fas fa-calendar-alt"></i><span>Planner</span></a>
    </nav>

    <lpv-entry-form></lpv-entry-form>

    <div id="task-manager-modal" class="modal-overlay hidden mural-task-modal">
        <div class="modal-glass mural-modal-glass" style="display: flex; flex-direction: column; max-height: 90vh; padding: 0; overflow: hidden;">
            <div class="mural-modal-topbar" style="flex-shrink: 0; display: flex; justify-content: flex-end; background: var(--background-glass);">
                <button id="close-tm-btn" class="btn-close-modal" style="position: relative; top: auto; right: auto; background: rgba(0,0,0,0.1); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="view-details-content" style="flex: 1; overflow-y: auto;">
                <div id="tm-info-grid"></div>
                <div class="modal-footer mural-modal-footer" style="justify-content: space-between; margin-top: 2rem; gap: 10px;">
                    <button id="btn-delete-task" class="btn btn-secondary" style="color: var(--color-error); border-color: var(--color-error); margin-right: auto;">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
            <div id="view-k7-form" class="hidden" style="padding: 20px; overflow-y: auto;"><form id="form-k7"></form></div>
        </div>
    </div>

    
    

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <script type="module" src="../assets/js/components/entry-form.js"></script>
    <script type="module" src="../assets/js/core.js"></script>
    <script type="module" src="../assets/js/components/task-manager.js"></script>
    <script type="module" src="../assets/js/components/entry-modal.js"></script>
    <script type="module" src="../assets/js/pages/mural.js"></script>

</body>
</html>
