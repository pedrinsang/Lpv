<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Redireciona quem chega pelo endereço antigo. Tem que vir antes de tudo. -->
    <script src="../assets/js/migracao.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hub Laboratório | LPV</title>
    <script>
        (function() {
            document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <link rel="stylesheet" href="../assets/css/pages/hub.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" href="../assets/images/lpvminilogo2.png">
</head>
<body>

    <aside class="desktop-sidebar">
        <div class="sidebar-header">
            <img src="../assets/images/lpvminilogo2.png" alt="LPV" class="light-mode-only" style="height: 40px;">
            <img src="../assets/images/lpvminilogo.png" alt="LPV" class="dark-mode-only" style="height: 40px;">
            <div style="line-height: 1;">
                <div class="sidebar-brand-text">LPV Digital</div>
                <div style="font-size: 0.75rem; color: var(--text-secondary);">Patologia Veterinária</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="hub.html" class="sidebar-link active"><i class="fas fa-home"></i> <span>Visão Geral</span></a>
            <a href="mural.html" class="sidebar-link"><i class="fas fa-columns"></i> <span>Mural</span></a>
            <a href="historico.html" class="sidebar-link"><i class="fas fa-history"></i> <span>Registros</span></a>
            <a href="estoque.html" class="sidebar-link"><i class="fas fa-boxes-stacked"></i> <span>Estoque</span></a>
            <a href="planner.html" class="sidebar-link"><i class="fas fa-calendar-alt"></i> <span>Planner</span></a>
            <a href="admin.html" class="sidebar-link hidden" id="sidebar-admin-link"><i class="fas fa-shield-alt"></i> <span>Admin</span></a>
            <button class="sidebar-link btn-sidebar-new" id="open-entry-modal">
                <i class="fas fa-plus"></i> <span>Nova Entrada</span>
            </button>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-user-avatar"><i class="fas fa-user"></i></div>
            <div class="sidebar-user-info">
                <div id="sidebar-user-name" class="user-name-text">Carregando...</div>
                <div id="sidebar-user-role" class="user-role-text">...</div>
            </div>
            <button class="btn-sidebar-settings" onclick="window.location.href='perfil.html'" title="Perfil">
                <i class="fas fa-cog"></i>
            </button>
        </div>
    </aside>

    <div class="layout-wrapper">
        <header class="app-header">
            <div class="header-brand" style="display: flex; align-items: center; gap: 10px;">
                <button id="mobile-menu-btn" class="btn-icon mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </button>
                <img src="../assets/images/lpvminilogo2.png" alt="Logo" class="header-logo light-mode-only">
                <img src="../assets/images/lpvminilogo.png" alt="Logo" class="header-logo dark-mode-only">
                <div class="header-text-column">
                    <span class="brand-title">LPV<span class="brand-subtitle">Hub</span></span>
                    <span id="user-role-badge" class="user-badge">...</span>
                </div>
                <span class="page-title">Dashboard</span>
            </div>    
            <div style="display: flex; gap: 10px;">
                <button id="logout-btn" class="btn-icon" style="color: var(--color-error);"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <main class="main-container hub-main">
            <div class="hub-layout">

                <!-- URGÊNCIAS -->
                <section class="urgent-section">
                    <div class="section-header">
                        <div class="section-heading">
                            <h3 class="section-title">Urgências</h3>
                            <span id="urgent-count" class="urgent-count">0 casos</span>
                        </div>
                        <div id="queue-filter-container" class="queue-filter hidden" aria-label="Filtro da fila">
                            <button id="queue-filter-mine" type="button" class="queue-filter-btn">Minhas</button>
                            <button id="queue-filter-all" type="button" class="queue-filter-btn is-active">Todas</button>
                        </div>
                    </div>
                    <div id="urgent-list" class="urgent-list"></div>
                </section>

                <aside class="hub-rail">
                    <!-- ESTOQUE -->
                    <a href="estoque.html" class="inventory-hub-panel">
                        <div class="inventory-hub-heading">
                            <span class="inventory-hub-icon"><i class="fas fa-boxes-stacked"></i></span>
                            <div>
                                <strong>Estoque</strong>
                                <small id="hub-stock-subtitle">Carregando prazos...</small>
                            </div>
                            <i class="fas fa-chevron-right inventory-hub-arrow"></i>
                        </div>
                        <div id="hub-stock-alerts" class="inventory-hub-alerts"></div>
                    </a>
                </aside>

                <!-- SEMANA -->
                <section class="week-section">
                    <div class="section-header">
                        <div class="section-heading">
                            <h3 class="section-title">Semana</h3>
                            <a href="planner.html" class="week-link">Abrir planner <i class="fas fa-arrow-right"></i></a>
                        </div>
                        <div class="week-nav">
                            <button id="week-prev" class="btn-week-nav" type="button" aria-label="Semana anterior"><i class="fas fa-chevron-left"></i></button>
                            <span id="week-range-label" class="week-range-label">---</span>
                            <button id="week-next" class="btn-week-nav" type="button" aria-label="Próxima semana"><i class="fas fa-chevron-right"></i></button>
                            <button id="week-today" class="btn-week-today" type="button">Hoje</button>
                        </div>
                    </div>
                    <div id="week-grid" class="week-grid"></div>
                </section>
            </div>

        </main>
    </div>

    <nav class="bottom-nav">
        <a href="hub.html" class="nav-item active"><i class="fas fa-home"></i><span>Início</span></a>
        <a href="mural.html" class="nav-item"><i class="fas fa-columns"></i><span>Mural</span></a>
        <div class="nav-fab-container">
            <button class="nav-fab" id="mobile-open-entry"><i class="fas fa-plus"></i></button>
        </div>
        <a href="historico.html" class="nav-item"><i class="fas fa-history"></i><span>Registros</span></a>
        <a href="planner.html" class="nav-item"><i class="fas fa-calendar-alt"></i><span>Planner</span></a>
    </nav>

    <lpv-entry-form></lpv-entry-form>

    <div id="task-manager-modal" class="modal-overlay hidden">
        <div class="modal-glass" style="display: flex; flex-direction: column; max-height: 90vh; padding: 0; overflow: hidden;">
            <div style="flex-shrink: 0; display: flex; justify-content: flex-end; background: var(--background-glass);">
                <button id="close-tm-btn" class="btn-close-modal" style="position: relative; top: auto; right: auto; background: rgba(0,0,0,0.1); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="view-details-content" style="flex: 1; overflow-y: auto;">
                <div id="tm-info-grid"></div>
                <div class="modal-footer" style="justify-content: space-between; margin-top: 2rem; gap: 10px;">
                    <button id="btn-delete-task" class="btn btn-secondary" style="color: var(--color-error); border-color: var(--color-error); margin-right: auto;">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
            <div id="view-k7-form" class="hidden" style="padding: 20px; overflow-y: auto;">
                <form id="form-k7"></form>
            </div>
            <div id="view-release-form" class="hidden" style="padding: 20px; overflow-y: auto;">
                <form id="form-release"></form>
            </div>
        </div>
    </div>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <script type="module" src="../assets/js/components/entry-form.js"></script>
    <script type="module" src="../assets/js/components/entry-modal.js"></script>
    <script type="module" src="../assets/js/core.js"></script>
    <script type="module" src="../assets/js/components/task-manager.js"></script> 
    <script type="module" src="../assets/js/pages/hub.js"></script>


</body>
</html>
